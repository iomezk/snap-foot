name: foot-terminal
title: foot-terminal
summary: A fast, lightweight and minimalistic Wayland terminal emulator
description: |
  ssh can be used to escape from the snap's confined environment. ssh keys directory is /home/$USER/snap/foot-terminal/common/.ssh/

  For autoconnection put to your /home/$USER/snap/foot-terminal/common/.config/foot/foot.ini something like this:  
  shell=ssh -t -o SendEnv=WAYLAND_DISPLAY user@localhost tmux -u new -A

  Also this snap allows to activate the terminal emulator by opening any character device: xdg-open /dev/random
source-code: https://github.com/iomezk/snap-foot/tree/core24
contact: https://github.com/iomezk/snap-foot/issues
issues: https://github.com/iomezk/snap-foot/issues
website: https://github.com/iomezk/snap-foot
license: MIT
base: core24
confinement: strict
grade: stable
icon: icon.svg
compression: lzo

apps:
  foot-terminal:
    command: bin/foot
    plugs:
    - network
    - opengl
    - wayland

environment:
  HOME: $SNAP_USER_COMMON
  PATH: $SNAP/bin:$PATH
  LD_LIBRARY_PATH: $SNAP/mesa/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/gui-lib/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
  FONTCONFIG_PATH: $SNAP/gui-lib/etc/fonts
  FONTCONFIG_FILE: $SNAP/etc/fonts/fonts.conf

plugs:
  gnome-42-2204:
    interface: content
    default-provider: gnome-46-2404
    target: $SNAP/gui-lib
  gpu-2404:
    interface: content
    default-provider: mesa-2404
    target: $SNAP/mesa

layout:
  /usr/share/font1:
    symlink: $SNAP/gui-lib/usr/share/fonts
  /usr/share/X11:
    symlink: $SNAP/gui-lib/usr/share/X11

package-repositories:
- type: apt
  formats:
  - deb-src
  components:
  - main
  suites:
  - noble-updates
  key-id: F6ECB3762474EDA9D21B7022871920D1991BC93C
  url: http://archive.ubuntu.com/ubuntu

adopt-info: foot
parts:
  local:
    source: snap/local/
    source-type: local
    plugin: dump
    prime:
    - -patches/
  foot:
    source: https://codeberg.org/dnkl/foot/archive/1.27.0.tar.gz
    source-checksum: sha256/f5917cad2d7b723b99873e53d78fd10ea202923d189aed5086591fc53b70b7e3
    source-type: tar
    plugin: meson
    build-snaps:
    - gnome-46-2404-sdk
    build-packages:
    - meson
    - git  # for latest libfcft-dev
    - jq
    - libtllist-dev
    build-environment:
    - LD_LIBRARY_PATH: /snap/gnome-46-2404-sdk/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/snap/gnome-46-2404-sdk/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/snap/gnome-46-2404-sdk/current/usr/lib:/snap/gnome-46-2404-sdk/current/usr/lib/vala-current:/snap/gnome-46-2404-sdk/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
    - PKG_CONFIG_PATH: /snap/gnome-46-2404-sdk/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig:/snap/gnome-46-2404-sdk/current/usr/lib/pkgconfig:/snap/gnome-46-2404-sdk/current/usr/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
    meson-parameters:
    - --buildtype=release
    - --strip
    - --prefix=/
    - -Dc_args=-Wno-pedantic  # error: ISO C does not support the ‘_Float*’ type [-Werror=pedantic]
    - -Dthemes=false
    - -Dime=false
    - -Dtests=false
    - -Dterminfo=disabled
    - -Ddefault-terminfo=xterm-256color
    override-pull: |
      craftctl default
      patch -p1 -i "$CRAFT_PROJECT_DIR/snap/local/patches/foot-fixed-runtime-dir.patch"
      patch -p1 -i "$CRAFT_PROJECT_DIR/snap/local/patches/foot-default-theme.patch"
      patch -p1 -i "$CRAFT_PROJECT_DIR/snap/local/patches/foot-ignore-args.patch"
      patch -p1 -i "$CRAFT_PROJECT_DIR/snap/local/patches/foot-apparmor-flood.patch"
    override-build: |
      craftctl default
      craftctl set "version=$(jq -r .version meson-info/intro-projectinfo.json)"
    prime:
    - bin/foot
  ssh:
    plugin: nil
    build-packages:
    - dpkg-dev
    override-pull: |
      apt source openssh-client
      cd */
      patch -p1 -i "$CRAFT_PROJECT_DIR/snap/local/patches/ssh-home-env.patch"
      patch -p1 -i "$CRAFT_PROJECT_DIR/snap/local/patches/ssh-apparmor-flood.patch"
      apt build-dep -y openssh-client
      DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -B --no-sign -jauto
      mkdir "$CRAFT_PART_INSTALL/bin/"
      cp debian/openssh-client/usr/bin/ssh "$CRAFT_PART_INSTALL/bin/"
